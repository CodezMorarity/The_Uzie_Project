name: Windows package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --no-progress --yes
      - name: Build, test, and package for Windows
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload Windows distributions
        uses: actions/upload-artifact@v4
        with:
          name: VaultX-Windows-x64
          path: |
            target/dist/VaultX-1.0.0.msi
            target/dist/VaultX-portable.zip
          if-no-files-found: error
